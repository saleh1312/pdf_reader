[project]
name = "manger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saleh1312", email = "profsoft1312@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
manger = "manger:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
