[project]
name = "manger"
version = "0.1.0"
description = "Chat sessions and messages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.57.0",
    "psycopg[binary]>=3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
