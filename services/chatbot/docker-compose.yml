services:
  chatbot-postgres:
    image: postgres:16-alpine
    container_name: pdf_reader_chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CHATBOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHATBOT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHATBOT_POSTGRES_DB}
    ports:
      - "${CHATBOT_POSTGRES_PORT}:5432"
    volumes:
      - chatbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatbot_postgres_data:
    name: chatbot_chatbot_postgres_data
