services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pdf_reader_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  vllm:
    image: vllm/vllm-openai:latest
    container_name: pdf_reader_vllm
    restart: unless-stopped
    ipc: host
    gpus: all
    environment:
      VLLM_PORT: ${VLLM_PORT}
    ports:
      - "${VLLM_PORT}:${VLLM_PORT}"
    volumes:
      - vllm-huggingface:/root/.cache/huggingface
    command:
      - ${VLLM_MODEL_REPO}
      - --served-model-name
      - ${VLLM_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_PORT}
      - --trust-remote-code
      - --no-enable-prefix-caching
      - --max-num-batched-tokens
      - "16384"
      - --mm-processor-cache-gb
      - "0"
      - --gpu-memory-utilization
      - "0.6"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ['VLLM_PORT'])",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

volumes:
  vllm-huggingface:
    name: parsing_vllm-huggingface
