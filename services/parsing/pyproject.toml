[project]
name = "parsing"
version = "0.1.0"
description = "Worker that receives book parse requests"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.55.1",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "paddlex[ocr]>=3.7.2",
    "pika>=1.3.2",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
